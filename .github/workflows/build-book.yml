name: Build downloadable book

on:
  push:
    branches: [main]
    paths:
      - 'chapters/**'
      - 'appendices/**'
      - 'assets/images/**'
      - 'references/**'
      - 'book.json'
      - 'scripts/build_book.py'
      - 'scripts/epub.css'
      - 'site/requirements.txt'
      - '.github/workflows/build-book.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  epub:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: site/requirements.txt
      - name: Install book export tools
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends pandoc inkscape fonts-noto-cjk
          python -m pip install --only-binary=:all: -r site/requirements.txt
      - name: Build and validate illustrated EPUB
        run: python scripts/build_book.py
      - name: Upload downloadable book
        uses: actions/upload-artifact@v4
        with:
          name: linux-book
          path: |
            build/Linux-From-the-Ground-Up.epub
            build/Linux-From-the-Ground-Up.md
            build/validation.json
          if-no-files-found: error
          retention-days: 90
