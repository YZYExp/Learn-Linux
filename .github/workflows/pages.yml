name: Build and publish book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out book and its history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: site/requirements.txt
      - name: Install book publishing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc inkscape fonts-noto-cjk
          python -m pip install -r site/requirements.txt
      - name: Validate sources and build illustrated EPUB
        run: python scripts/build_book.py
      - name: Build homepage and reading pages
        run: python scripts/build_site.py --base-path "/${GITHUB_REPOSITORY#*/}/"
      - name: Check browser script syntax
        run: node --check site/app.js
      - name: Upload reading files
        uses: actions/upload-artifact@v4
        with:
          name: linux-book-${{ github.sha }}
          path: |
            build/Linux-From-the-Ground-Up.epub
            build/Linux-From-the-Ground-Up.md
            build/validation.json
      - name: Upload Pages website
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
