<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
<title id="title">把机制连起来：一次容器内的文件读取与联网</title><desc id="desc">从进程看请求路径；跨过哪些边界，取决于它实际运行在哪里。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#157d7b"/></marker><marker id="arrowO" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#cd713e"/></marker></defs>
<rect width="1200" height="980" fill="#f7f5ef"/>
<style>text{font-family:"Noto Sans SC","Noto Sans CJK SC",sans-serif}.body{font-size:20px}.small{font-size:17px;fill:#5a6c75}</style>
<text x="54" y="60" font-size="32" fill="#19364a" text-anchor="start" font-weight="700">把机制连起来：一次容器内的文件读取与联网</text>
<text x="54" y="99" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">从进程看请求路径；跨过哪些边界，取决于它实际运行在哪里。</text>
<path d="M54 123H1146" stroke="#aebbbd"/>
<rect x="390" y="165" width="420" height="100" rx="15" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="600.0" y="200" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">容器内应用进程</text>
<text x="600.0" y="231" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">自己的部分资源视图</text>
<rect x="65" y="345" width="310" height="115" rx="15" fill="#e5f1ed" stroke="#aebbbd" stroke-width="1.5"/>
<text x="220.0" y="380" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">文件路径</text>
<text x="220.0" y="411" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">mount namespace + VFS</text>
<text x="220.0" y="438" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">普通文件 / 叠加层 / FUSE</text>
<rect x="445" y="345" width="310" height="115" rx="15" fill="#ffffff" stroke="#aebbbd" stroke-width="1.5"/>
<text x="600.0" y="380" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">执行与预算</text>
<text x="600.0" y="411" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">调度 + 页表</text>
<text x="600.0" y="438" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">cgroup 记账与限制</text>
<rect x="825" y="345" width="310" height="115" rx="15" fill="#e5f1ed" stroke="#aebbbd" stroke-width="1.5"/>
<text x="980.0" y="380" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">网络路径</text>
<text x="980.0" y="411" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">socket + network namespace</text>
<text x="980.0" y="438" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">veth / 路由按部署决定</text>
<path d="M480 265L220 345" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M600 265L600 345" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M720 265L980 345" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="65" y="575" width="310" height="100" rx="15" fill="#ffffff" stroke="#aebbbd" stroke-width="1.5"/>
<text x="220.0" y="610" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">文件后端</text>
<text x="220.0" y="641" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">页缓存 / 本地盘 / 守护进程</text>
<rect x="825" y="575" width="310" height="100" rx="15" fill="#ffffff" stroke="#aebbbd" stroke-width="1.5"/>
<text x="980.0" y="610" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">网络后端</text>
<text x="980.0" y="641" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">宿主链路或虚拟网卡</text>
<path d="M220 460L220 575" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M980 460L980 575" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="390" y="575" width="420" height="100" rx="15" fill="#fbebdf" stroke="#aebbbd" stroke-width="1.5"/>
<text x="600.0" y="610" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">当前 Linux 内核</text>
<text x="600.0" y="641" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">容器共享这一内核</text>
<path d="M600 460L600 575" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="390" y="795" width="420" height="100" rx="15" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="600.0" y="830" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">可选：外层虚拟机</text>
<text x="600.0" y="861" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">guest Linux → 虚拟硬件</text>
<text x="600.0" y="888" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">再由宿主虚拟化栈提供资源</text>
<path d="M600 675L600 795" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="600.0" y="726.0" font-size="17" fill="#157d7b" text-anchor="middle" font-weight="400">当 Linux 自身是 guest</text>
<text x="64" y="745" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">Linux 裸机容器不需要外层 VM；macOS 上的 Linux 容器常在 Linux VM 中运行。</text>
<path d="M54 915H1146" stroke="#aebbbd"/>
<text x="54" y="948" font-size="17" fill="#5a6c75" text-anchor="start" font-weight="400">原创机制示意 · 省略实现细节</text>
<text x="1146" y="948" font-size="17" fill="#5a6c75" text-anchor="end" font-weight="400">20</text>
</svg>