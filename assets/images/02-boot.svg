<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">启动：谁把控制权交给谁</title><desc id="desc">引导器与早期用户态的具体组合取决于平台和发行版。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#157d7b"/></marker><marker id="arrowO" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#cd713e"/></marker></defs>
<rect width="1200" height="900" fill="#f7f5ef"/>
<style>text{font-family:"Noto Sans SC","Noto Sans CJK SC",sans-serif}.body{font-size:20px}.small{font-size:17px;fill:#5a6c75}</style>
<text x="54" y="60" font-size="32" fill="#19364a" text-anchor="start" font-weight="700">启动：谁把控制权交给谁</text>
<text x="54" y="99" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">引导器与早期用户态的具体组合取决于平台和发行版。</text>
<path d="M54 123H1146" stroke="#aebbbd"/>
<rect x="70" y="165" width="230" height="90" rx="15" fill="#fbebdf" stroke="#aebbbd" stroke-width="1.5"/>
<text x="185.0" y="200" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">固件</text>
<text x="185.0" y="231" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">UEFI 等</text>
<rect x="400" y="165" width="310" height="90" rx="15" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="555.0" y="200" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">引导器 / EFI stub</text>
<text x="555.0" y="231" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">加载与进入内核</text>
<rect x="820" y="165" width="310" height="90" rx="15" fill="#e5f1ed" stroke="#aebbbd" stroke-width="1.5"/>
<text x="975.0" y="200" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">Linux 内核</text>
<text x="975.0" y="231" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">初始化关键子系统</text>
<path d="M300 210L400 210" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M710 210L820 210" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="820" y="340" width="310" height="110" rx="15" fill="#ffffff" stroke="#aebbbd" stroke-width="1.5"/>
<text x="975.0" y="375" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">早期用户态（可选）</text>
<text x="975.0" y="406" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">initramfs 中的 /init</text>
<text x="975.0" y="433" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">准备并切换真实根</text>
<path d="M975 255L975 340" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="400" y="535" width="310" height="110" rx="15" fill="#e5f1ed" stroke="#aebbbd" stroke-width="1.5"/>
<text x="555.0" y="570" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">真实根上的 init</text>
<text x="555.0" y="601" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">PID 1；实现不限定</text>
<text x="555.0" y="628" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">例如 systemd 或其他 init</text>
<path d="M975,450L975,590L710,590" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M820,235L760,235L760,485L555,485L555,535" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="690" y="466" font-size="17" fill="#5a6c75" text-anchor="middle" font-weight="400">无需 initramfs 的路径</text>
<rect x="70" y="535" width="230" height="110" rx="15" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="185.0" y="570" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">系统服务</text>
<text x="185.0" y="601" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">按依赖并行启动</text>
<text x="185.0" y="628" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">再提供登录与应用</text>
<path d="M400 590L300 590" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="64" y="725" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">initramfs 不是所有 Linux 的必需品；systemd 也不是 Linux 内核的一部分。</text>
<text x="64" y="753" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">图中的交接是概念路径，不代表所有设备相同的实际启动时序。</text>
<text x="64" y="781" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">也可直接在 initramfs 中提供最终用户环境，无须另挂真实根。</text>
<path d="M54 835H1146" stroke="#aebbbd"/>
<text x="54" y="868" font-size="17" fill="#5a6c75" text-anchor="start" font-weight="400">原创机制示意 · 省略实现细节</text>
<text x="1146" y="868" font-size="17" fill="#5a6c75" text-anchor="end" font-weight="400">02</text>
</svg>