<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1320" viewBox="0 0 800 1320" role="img" aria-labelledby="title desc">
<title id="title">案例四：从服务变慢到可检验的解释</title><desc id="desc">先分开现象、证据与假设，再选择验证动作。原创教学示意，非实际时序或性能测量。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#157d7b"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#cd713e"/></marker></defs>
<rect width="800" height="1320" fill="#f7f5ef"/>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif}</style>
<text x="44" y="55" font-size="29" fill="#19364a" font-weight="700" text-anchor="start">案例四：从服务变慢到可检验的解释</text>
<text x="44" y="91" font-size="20" fill="#5a6c75" font-weight="400" text-anchor="start">先分开现象、证据与假设，再选择验证动作</text>
<path d="M44 116H756" stroke="#aebbbd"/>
<rect x="60" y="145" width="680" height="145" rx="18" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="82" y="182" font-size="25" fill="#19364a" font-weight="700" text-anchor="start">① 定义现象与发生范围</text>
<text x="82" y="217" font-size="21" fill="#5a6c75" font-weight="400" text-anchor="start">哪类请求变慢？尾延迟还是吞吐？从何时开始？</text>
<text x="82" y="249" font-size="21" fill="#5a6c75" font-weight="400" text-anchor="start">记录负载、版本与资源限制等同时变化的条件。</text>
<path d="M400 290L400 340" fill="none" stroke="#157d7b" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="60" y="340" width="680" height="145" rx="18" fill="#e5f1ed" stroke="#aebbbd" stroke-width="1.5"/>
<text x="82" y="377" font-size="25" fill="#19364a" font-weight="700" text-anchor="start">② 从多个方向收集证据</text>
<text x="82" y="412" font-size="21" fill="#5a6c75" font-weight="400" text-anchor="start">CPU：运行时间、可运行队列、配额节流。</text>
<text x="82" y="444" font-size="21" fill="#5a6c75" font-weight="400" text-anchor="start">等待：锁竞争、存储／网络、资源压力与排队。</text>
<path d="M235 485L235 545" fill="none" stroke="#157d7b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M565 485L565 545" fill="none" stroke="#157d7b" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="60" y="545" width="325" height="180" rx="18" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="82" y="582" font-size="25" fill="#19364a" font-weight="700" text-anchor="start">观察信号</text>
<text x="82" y="617" font-size="21" fill="#5a6c75" font-weight="400" text-anchor="start">例如 CPU 利用率</text>
<text x="82" y="649" font-size="21" fill="#5a6c75" font-weight="400" text-anchor="start">I/O 延迟与 PSI</text>
<text x="82" y="681" font-size="21" fill="#5a6c75" font-weight="400" text-anchor="start">应用请求追踪</text>
<rect x="415" y="545" width="325" height="180" rx="18" fill="#f7e9df" stroke="#aebbbd" stroke-width="1.5"/>
<text x="437" y="582" font-size="25" fill="#19364a" font-weight="700" text-anchor="start">保留上下文</text>
<text x="437" y="617" font-size="21" fill="#5a6c75" font-weight="400" text-anchor="start">容器还是宿主范围？</text>
<text x="437" y="649" font-size="21" fill="#5a6c75" font-weight="400" text-anchor="start">时间窗口是否一致？</text>
<text x="437" y="681" font-size="21" fill="#5a6c75" font-weight="400" text-anchor="start">指标口径是否匹配？</text>
<path d="M235 725L235 775" fill="none" stroke="#157d7b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M565 725L565 775" fill="none" stroke="#157d7b" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="60" y="775" width="680" height="145" rx="18" fill="#e5f1ed" stroke="#aebbbd" stroke-width="1.5"/>
<text x="82" y="812" font-size="25" fill="#19364a" font-weight="700" text-anchor="start">③ 提出能被反驳的假设</text>
<text x="82" y="847" font-size="21" fill="#5a6c75" font-weight="400" text-anchor="start">例：请求等待 CPU 配额，而非“机器没有空闲核”。</text>
<text x="82" y="879" font-size="21" fill="#5a6c75" font-weight="400" text-anchor="start">列出支持该假设的证据与能推翻它的结果。</text>
<path d="M400 920L400 970" fill="none" stroke="#157d7b" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="60" y="970" width="680" height="145" rx="18" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="82" y="1007" font-size="25" fill="#19364a" font-weight="700" text-anchor="start">④ 在可控条件下验证并复查</text>
<text x="82" y="1042" font-size="21" fill="#5a6c75" font-weight="400" text-anchor="start">一次改变一个关键条件，比较同口径的结果。</text>
<text x="82" y="1074" font-size="21" fill="#5a6c75" font-weight="400" text-anchor="start">记录不确定性，避免把相关性当作因果。</text>
<text x="60" y="1175" font-size="19" fill="#5a6c75" font-weight="400" text-anchor="start">边界：PSI 表达资源停顿压力，单一指标不能独立证明根因。</text>
<text x="60" y="1208" font-size="19" fill="#5a6c75" font-weight="400" text-anchor="start">此图是诊断方法，不是已经完成的性能实验。</text>
<text x="44" y="1292" font-size="17" fill="#5a6c75" font-weight="400" text-anchor="start">原创机制示意 · 箭头表示关系或可能路径，并非完整执行轨迹</text>
</svg>
