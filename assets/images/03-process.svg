<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">任务：运行、等待与资源共享</title><desc id="desc">CPU 忙不忙，与任务能否运行，是两个不同问题。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#157d7b"/></marker><marker id="arrowO" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#cd713e"/></marker></defs>
<rect width="1200" height="820" fill="#f7f5ef"/>
<style>text{font-family:"Noto Sans SC","Noto Sans CJK SC",sans-serif}.body{font-size:20px}.small{font-size:17px;fill:#5a6c75}</style>
<text x="54" y="60" font-size="32" fill="#19364a" text-anchor="start" font-weight="700">任务：运行、等待与资源共享</text>
<text x="54" y="99" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">CPU 忙不忙，与任务能否运行，是两个不同问题。</text>
<path d="M54 123H1146" stroke="#aebbbd"/>
<rect x="80" y="190" width="250" height="115" rx="15" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="205.0" y="225" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">可运行</text>
<text x="205.0" y="256" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">已具备执行条件</text>
<text x="205.0" y="283" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">等待调度</text>
<rect x="475" y="190" width="250" height="115" rx="15" fill="#e5f1ed" stroke="#aebbbd" stroke-width="1.5"/>
<text x="600.0" y="225" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">运行中</text>
<text x="600.0" y="256" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">当前占用 CPU</text>
<text x="600.0" y="283" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">执行用户或内核代码</text>
<rect x="870" y="190" width="250" height="115" rx="15" fill="#fbebdf" stroke="#aebbbd" stroke-width="1.5"/>
<text x="995.0" y="225" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">阻塞等待</text>
<text x="995.0" y="256" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">例如等待 I/O</text>
<text x="995.0" y="283" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">暂不参与普通竞争</text>
<path d="M330 230L475 230" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="402.5" y="221.0" font-size="17" fill="#157d7b" text-anchor="middle" font-weight="400">被选中</text>
<path d="M725 250L870 250" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="797.5" y="241.0" font-size="17" fill="#157d7b" text-anchor="middle" font-weight="400">等待事件</text>
<path d="M600,190L600,155L205,155L205,190" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="390" y="150" font-size="17" fill="#157d7b" text-anchor="middle" font-weight="400">抢占 / 主动让出</text>
<path d="M995,305L995,355L205,355L205,305" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="600" y="347" font-size="17" fill="#157d7b" text-anchor="middle" font-weight="400">事件完成后唤醒</text>
<rect x="70" y="415" width="1060" height="260" rx="20" fill="none" stroke="#aebbbd" stroke-dasharray="6 6"/>
<text x="90" y="448" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">同一进程中的线程：各自被调度，共享部分资源</text>
<rect x="110" y="475" width="270" height="100" rx="15" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="245.0" y="510" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">线程 A</text>
<text x="245.0" y="541" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">独立寄存器与栈</text>
<rect x="440" y="475" width="270" height="100" rx="15" fill="#e5f1ed" stroke="#aebbbd" stroke-width="1.5"/>
<text x="575.0" y="510" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">共享地址空间</text>
<text x="575.0" y="541" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">代码 · 堆 · 已映射对象</text>
<rect x="770" y="475" width="320" height="100" rx="15" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="930.0" y="510" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">线程 B</text>
<text x="930.0" y="541" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">独立寄存器与栈</text>
<path d="M380 525L440 525" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M770 525L710 525" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="64" y="635" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">共享不等于无需同步；进程和线程的资源共享关系由创建方式决定。</text>
<path d="M54 755H1146" stroke="#aebbbd"/>
<text x="54" y="788" font-size="17" fill="#5a6c75" text-anchor="start" font-weight="400">原创机制示意 · 省略实现细节</text>
<text x="1146" y="788" font-size="17" fill="#5a6c75" text-anchor="end" font-weight="400">03</text>
</svg>