<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">KVM：把虚拟 CPU 运行能力交给 Linux 内核</title><desc id="desc">虚拟机管理、CPU 执行与设备 I/O 是协作关系。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#157d7b"/></marker><marker id="arrowO" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#cd713e"/></marker></defs>
<rect width="1200" height="920" fill="#f7f5ef"/>
<style>text{font-family:"Noto Sans SC","Noto Sans CJK SC",sans-serif}.body{font-size:20px}.small{font-size:17px;fill:#5a6c75}</style>
<text x="54" y="60" font-size="32" fill="#19364a" text-anchor="start" font-weight="700">KVM：把虚拟 CPU 运行能力交给 Linux 内核</text>
<text x="54" y="99" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">虚拟机管理、CPU 执行与设备 I/O 是协作关系。</text>
<path d="M54 123H1146" stroke="#aebbbd"/>
<rect x="65" y="155" width="1070" height="200" rx="20" fill="none" stroke="#aebbbd" stroke-dasharray="6 6"/>
<text x="85" y="188" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">宿主用户态</text>
<rect x="100" y="220" width="430" height="100" rx="15" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="315.0" y="255" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">QEMU 等虚拟机进程</text>
<text x="315.0" y="286" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">组织 guest 内存、设备与管理接口</text>
<rect x="700" y="220" width="400" height="100" rx="15" fill="#ffffff" stroke="#aebbbd" stroke-width="1.5"/>
<text x="900.0" y="255" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">设备模型 / I/O 后端</text>
<text x="900.0" y="286" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">部分设备操作由用户态处理</text>
<rect x="65" y="400" width="1070" height="200" rx="20" fill="none" stroke="#aebbbd" stroke-dasharray="6 6"/>
<text x="85" y="433" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">宿主内核态</text>
<rect x="100" y="465" width="430" height="100" rx="15" fill="#e5f1ed" stroke="#aebbbd" stroke-width="1.5"/>
<text x="315.0" y="500" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">KVM：VM / vCPU 接口</text>
<text x="315.0" y="531" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">通过 /dev/kvm 与 ioctl 控制</text>
<rect x="700" y="465" width="400" height="100" rx="15" fill="#e5f1ed" stroke="#aebbbd" stroke-width="1.5"/>
<text x="900.0" y="500" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">内核 I/O 加速（可选）</text>
<text x="900.0" y="531" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">例如 vhost；并非每次 I/O 都进用户态</text>
<path d="M315 320L315 465" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="315.0" y="383.5" font-size="17" fill="#157d7b" text-anchor="middle" font-weight="400">控制 / KVM_RUN</text>
<path d="M900 320L900 465" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="100" y="690" width="430" height="100" rx="15" fill="#fbebdf" stroke="#aebbbd" stroke-width="1.5"/>
<text x="315.0" y="725" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">硬件辅助虚拟化</text>
<text x="315.0" y="756" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">执行 guest CPU 上下文</text>
<text x="315.0" y="783" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">异常退出由相应路径处理</text>
<rect x="700" y="690" width="400" height="100" rx="15" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="900.0" y="725" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">guest 的 virtio 驱动</text>
<text x="900.0" y="756" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">经约定队列与宿主后端协作</text>
<path d="M315 565L315 690" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M900 690L900 565" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M530,515L615,515L615,270L700,270" fill="none" stroke="#cd713e" stroke-width="2.5" marker-end="url(#arrowO)" stroke-dasharray="6 5"/>
<text x="614" y="375" font-size="17" fill="#cd713e" text-anchor="middle" font-weight="400">需用户态处理的退出</text>
<path d="M54 855H1146" stroke="#aebbbd"/>
<text x="54" y="888" font-size="17" fill="#5a6c75" text-anchor="start" font-weight="400">原创机制示意 · 省略实现细节</text>
<text x="1146" y="888" font-size="17" fill="#5a6c75" text-anchor="end" font-weight="400">12</text>
</svg>