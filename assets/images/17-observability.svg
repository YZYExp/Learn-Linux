<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
<title id="title">从“变慢”到证据：让不同观察互相约束</title><desc id="desc">耗时是结果；调用、调度、资源压力与设备指标解释不同部分。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#157d7b"/></marker><marker id="arrowO" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#cd713e"/></marker></defs>
<rect width="1200" height="880" fill="#f7f5ef"/>
<style>text{font-family:"Noto Sans SC","Noto Sans CJK SC",sans-serif}.body{font-size:20px}.small{font-size:17px;fill:#5a6c75}</style>
<text x="54" y="60" font-size="32" fill="#19364a" text-anchor="start" font-weight="700">从“变慢”到证据：让不同观察互相约束</text>
<text x="54" y="99" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">耗时是结果；调用、调度、资源压力与设备指标解释不同部分。</text>
<path d="M54 123H1146" stroke="#aebbbd"/>
<rect x="380" y="170" width="440" height="100" rx="15" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="600.0" y="205" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">现象：请求耗时增加</text>
<text x="600.0" y="236" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">先定义测量范围与时间窗口</text>
<rect x="65" y="380" width="310" height="125" rx="15" fill="#ffffff" stroke="#aebbbd" stroke-width="1.5"/>
<text x="220.0" y="415" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">调用证据</text>
<text x="220.0" y="446" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">strace / 应用日志</text>
<text x="220.0" y="473" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">在哪个接口等待？</text>
<rect x="445" y="380" width="310" height="125" rx="15" fill="#e5f1ed" stroke="#aebbbd" stroke-width="1.5"/>
<text x="600.0" y="415" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">调度与压力证据</text>
<text x="600.0" y="446" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">perf / tracepoints / PSI</text>
<text x="600.0" y="473" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">任务为何没得到执行？</text>
<rect x="825" y="380" width="310" height="125" rx="15" fill="#fbebdf" stroke="#aebbbd" stroke-width="1.5"/>
<text x="980.0" y="415" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">资源与 I/O 证据</text>
<text x="980.0" y="446" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">/proc / sysfs / 计数器</text>
<text x="980.0" y="473" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">哪个资源路径拥挤？</text>
<path d="M480 270L220 380" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M600 270L600 380" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M720 270L980 380" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="210" y="635" width="780" height="80" rx="15" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="600.0" y="683.0" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">提出可检验解释 → 改变一个变量 → 对照观测</text>
<path d="M220 505L400 635" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M600 505L600 635" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M980 505L800 635" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="64" y="775" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">单个高计数器不自动证明根因；采样、跟踪和调试本身也可能影响被测对象。</text>
<path d="M54 815H1146" stroke="#aebbbd"/>
<text x="54" y="848" font-size="17" fill="#5a6c75" text-anchor="start" font-weight="400">原创机制示意 · 省略实现细节</text>
<text x="1146" y="848" font-size="17" fill="#5a6c75" text-anchor="end" font-weight="400">17</text>
</svg>