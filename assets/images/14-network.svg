<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">网络：接口、链路与路由属于不同层</title><desc id="desc">容器内的 localhost 只回到该网络命名空间；DNS 是名字解析。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#157d7b"/></marker><marker id="arrowO" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#cd713e"/></marker></defs>
<rect width="1200" height="900" fill="#f7f5ef"/>
<style>text{font-family:"Noto Sans SC","Noto Sans CJK SC",sans-serif}.body{font-size:20px}.small{font-size:17px;fill:#5a6c75}</style>
<text x="54" y="60" font-size="32" fill="#19364a" text-anchor="start" font-weight="700">网络：接口、链路与路由属于不同层</text>
<text x="54" y="99" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">容器内的 localhost 只回到该网络命名空间；DNS 是名字解析。</text>
<path d="M54 123H1146" stroke="#aebbbd"/>
<rect x="65" y="165" width="420" height="225" rx="20" fill="none" stroke="#aebbbd" stroke-dasharray="6 6"/>
<text x="85" y="198" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">网络命名空间 A</text>
<rect x="95" y="235" width="160" height="100" rx="15" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="175.0" y="270" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">应用 A</text>
<text x="175.0" y="301" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">socket / lo</text>
<rect x="305" y="235" width="150" height="100" rx="15" fill="#e5f1ed" stroke="#aebbbd" stroke-width="1.5"/>
<text x="380.0" y="270" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">veth A</text>
<text x="380.0" y="301" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">一端</text>
<path d="M255 285L305 285" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="715" y="165" width="420" height="225" rx="20" fill="none" stroke="#aebbbd" stroke-dasharray="6 6"/>
<text x="735" y="198" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">网络命名空间 B</text>
<rect x="745" y="235" width="150" height="100" rx="15" fill="#e5f1ed" stroke="#aebbbd" stroke-width="1.5"/>
<text x="820.0" y="270" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">veth B</text>
<text x="820.0" y="301" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">一端</text>
<rect x="945" y="235" width="160" height="100" rx="15" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="1025.0" y="270" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">应用 B</text>
<text x="1025.0" y="301" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">socket / lo</text>
<path d="M945 285L895 285" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="65" y="440" width="1070" height="250" rx="20" fill="none" stroke="#aebbbd" stroke-dasharray="6 6"/>
<text x="85" y="473" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">宿主网络命名空间：一种常见 bridge 拓扑</text>
<rect x="100" y="515" width="250" height="95" rx="15" fill="#ffffff" stroke="#aebbbd" stroke-width="1.5"/>
<text x="225.0" y="570.5" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">veth 对端 A</text>
<rect x="475" y="515" width="250" height="95" rx="15" fill="#e5f1ed" stroke="#aebbbd" stroke-width="1.5"/>
<text x="600.0" y="550" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">Linux bridge</text>
<text x="600.0" y="581" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">二层转发</text>
<rect x="850" y="515" width="250" height="95" rx="15" fill="#ffffff" stroke="#aebbbd" stroke-width="1.5"/>
<text x="975.0" y="570.5" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">veth 对端 B</text>
<path d="M380 335L225 515" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M820 335L975 515" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M350 562L475 562" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M850 562L725 562" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="475" y="725" width="250" height="75" rx="15" fill="#fbebdf" stroke="#aebbbd" stroke-width="1.5"/>
<text x="600.0" y="770.5" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">宿主路由 / 外部链路</text>
<path d="M600 610L600 725" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="64" y="775" font-size="18" fill="#5a6c75" text-anchor="start" font-weight="400">DNS：名字 → 地址；不替代数据包转发。</text>
<path d="M54 835H1146" stroke="#aebbbd"/>
<text x="54" y="868" font-size="17" fill="#5a6c75" text-anchor="start" font-weight="400">原创机制示意 · 省略实现细节</text>
<text x="1146" y="868" font-size="17" fill="#5a6c75" text-anchor="end" font-weight="400">14</text>
</svg>