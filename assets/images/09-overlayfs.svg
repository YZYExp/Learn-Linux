<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">OverlayFS：一份合并视图，多层真实对象</title><desc id="desc">镜像与可写层的叠加，是文件系统视图；不是块设备快照。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#157d7b"/></marker><marker id="arrowO" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#cd713e"/></marker></defs>
<rect width="1200" height="900" fill="#f7f5ef"/>
<style>text{font-family:"Noto Sans SC","Noto Sans CJK SC",sans-serif}.body{font-size:20px}.small{font-size:17px;fill:#5a6c75}</style>
<text x="54" y="60" font-size="32" fill="#19364a" text-anchor="start" font-weight="700">OverlayFS：一份合并视图，多层真实对象</text>
<text x="54" y="99" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">镜像与可写层的叠加，是文件系统视图；不是块设备快照。</text>
<path d="M54 123H1146" stroke="#aebbbd"/>
<rect x="65" y="180" width="300" height="125" rx="15" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="215.0" y="215" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">lower 层</text>
<text x="215.0" y="246" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">从叠加视图只读使用</text>
<text x="215.0" y="273" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">基础文件 a / b</text>
<rect x="450" y="180" width="300" height="125" rx="15" fill="#fbebdf" stroke="#aebbbd" stroke-width="1.5"/>
<text x="600.0" y="215" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">upper 层</text>
<text x="600.0" y="246" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">修改后的 a</text>
<text x="600.0" y="273" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">whiteout：隐藏 b</text>
<rect x="835" y="180" width="300" height="125" rx="15" fill="#ffffff" stroke="#aebbbd" stroke-width="1.5"/>
<text x="985.0" y="215" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">work 目录</text>
<text x="985.0" y="246" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">辅助内部操作</text>
<text x="985.0" y="273" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">与 upper 位于同一文件系统</text>
<rect x="250" y="465" width="700" height="140" rx="15" fill="#e5f1ed" stroke="#aebbbd" stroke-width="1.5"/>
<text x="600.0" y="500" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">merged 视图</text>
<text x="600.0" y="531" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">a 显示 upper 版本；b 被隐藏</text>
<text x="600.0" y="558" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">目录通常合并；opaque 标记可阻止下层目录合并</text>
<path d="M215 305L410 465" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M600 305L600 465" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M365,230L405,230L405,365L600,365L600,305" fill="none" stroke="#cd713e" stroke-width="2.5" marker-end="url(#arrowO)"/>
<text x="435" y="354" font-size="17" fill="#cd713e" text-anchor="middle" font-weight="400">需要时 copy-up</text>
<text x="64" y="685" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">copy-up 不等于修改 lower；whiteout 是“在合并视图中隐藏”，并未删除下层原文件。</text>
<text x="64" y="713" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">图示为基本语义；metacopy、redirect_dir 等选项会改变实现路径。</text>
<path d="M54 835H1146" stroke="#aebbbd"/>
<text x="54" y="868" font-size="17" fill="#5a6c75" text-anchor="start" font-weight="400">原创机制示意 · 省略实现细节</text>
<text x="1146" y="868" font-size="17" fill="#5a6c75" text-anchor="end" font-weight="400">09</text>
</svg>