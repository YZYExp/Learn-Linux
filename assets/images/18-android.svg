<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">Android：在 Linux 之上形成自己的平台</title><desc id="desc">共享内核基础，不等于采用桌面 Linux 的库、服务与应用接口。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#157d7b"/></marker><marker id="arrowO" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#cd713e"/></marker></defs>
<rect width="1200" height="920" fill="#f7f5ef"/>
<style>text{font-family:"Noto Sans SC","Noto Sans CJK SC",sans-serif}.body{font-size:20px}.small{font-size:17px;fill:#5a6c75}</style>
<text x="54" y="60" font-size="32" fill="#19364a" text-anchor="start" font-weight="700">Android：在 Linux 之上形成自己的平台</text>
<text x="54" y="99" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">共享内核基础，不等于采用桌面 Linux 的库、服务与应用接口。</text>
<path d="M54 123H1146" stroke="#aebbbd"/>
<rect x="65" y="170" width="1070" height="75" rx="15" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="600.0" y="215.5" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">Android 应用</text>
<rect x="65" y="290" width="1070" height="95" rx="15" fill="#ffffff" stroke="#aebbbd" stroke-width="1.5"/>
<text x="600.0" y="325" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">Framework / 系统服务</text>
<text x="600.0" y="356" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">面向应用的 API 与平台能力</text>
<rect x="65" y="435" width="500" height="110" rx="15" fill="#e5f1ed" stroke="#aebbbd" stroke-width="1.5"/>
<text x="315.0" y="470" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">ART 与 native 库</text>
<text x="315.0" y="501" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">运行时 · bionic · 图形/媒体等库</text>
<rect x="635" y="435" width="500" height="110" rx="15" fill="#ffffff" stroke="#aebbbd" stroke-width="1.5"/>
<text x="885.0" y="470" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">HAL 与厂商实现</text>
<text x="885.0" y="501" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">硬件抽象与设备服务</text>
<rect x="65" y="615" width="1070" height="115" rx="15" fill="#e5f1ed" stroke="#aebbbd" stroke-width="1.5"/>
<text x="600.0" y="650" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">Linux 内核</text>
<text x="600.0" y="681" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">调度 · 内存 · 驱动 · 网络；Binder 驱动支撑平台 IPC</text>
<rect x="65" y="785" width="1070" height="60" rx="15" fill="#fbebdf" stroke="#aebbbd" stroke-width="1.5"/>
<text x="600.0" y="823.0" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">硬件</text>
<path d="M600 245L600 290" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M315 385L315 435" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M885 385L885 435" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M315 545L315 615" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M885 545L885 615" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M600 730L600 785" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="600" y="585" font-size="17" fill="#5a6c75" text-anchor="middle" font-weight="400">Binder 连接不同进程中的平台组件；并非单一层中的一个应用库。</text>
<path d="M54 855H1146" stroke="#aebbbd"/>
<text x="54" y="888" font-size="17" fill="#5a6c75" text-anchor="start" font-weight="400">原创机制示意 · 省略实现细节</text>
<text x="1146" y="888" font-size="17" fill="#5a6c75" text-anchor="end" font-weight="400">18</text>
</svg>