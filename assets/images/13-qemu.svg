<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">QEMU：系统模型与执行引擎可以分开看</title><desc id="desc">“模拟整台机器”与“转译一个用户态程序”是不同模式。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#157d7b"/></marker><marker id="arrowO" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#cd713e"/></marker></defs>
<rect width="1200" height="920" fill="#f7f5ef"/>
<style>text{font-family:"Noto Sans SC","Noto Sans CJK SC",sans-serif}.body{font-size:20px}.small{font-size:17px;fill:#5a6c75}</style>
<text x="54" y="60" font-size="32" fill="#19364a" text-anchor="start" font-weight="700">QEMU：系统模型与执行引擎可以分开看</text>
<text x="54" y="99" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">“模拟整台机器”与“转译一个用户态程序”是不同模式。</text>
<path d="M54 123H1146" stroke="#aebbbd"/>
<rect x="65" y="160" width="1070" height="400" rx="20" fill="none" stroke="#aebbbd" stroke-dasharray="6 6"/>
<text x="85" y="193" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">System emulation：提供 CPU、内存和设备等机器模型</text>
<rect x="120" y="230" width="960" height="85" rx="15" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="600.0" y="280.5" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">guest 操作系统 + 应用</text>
<rect x="120" y="395" width="420" height="110" rx="15" fill="#e5f1ed" stroke="#aebbbd" stroke-width="1.5"/>
<text x="330.0" y="430" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">硬件虚拟化加速</text>
<text x="330.0" y="461" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">Linux 可用 KVM；macOS 可用 HVF</text>
<text x="330.0" y="488" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">受宿主架构与平台能力约束</text>
<rect x="660" y="395" width="420" height="110" rx="15" fill="#fbebdf" stroke="#aebbbd" stroke-width="1.5"/>
<text x="870.0" y="430" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">TCG 动态二进制翻译</text>
<text x="870.0" y="461" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">生成宿主可执行代码</text>
<text x="870.0" y="488" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">可支持跨 ISA，需付翻译成本</text>
<path d="M360 315L330 395" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M840 315L870 395" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="65" y="615" width="1070" height="180" rx="20" fill="none" stroke="#aebbbd" stroke-dasharray="6 6"/>
<text x="85" y="648" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">User-mode emulation：运行另一架构的 Linux 用户态程序</text>
<rect x="120" y="680" width="310" height="75" rx="15" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="275.0" y="725.5" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">目标程序的指令</text>
<rect x="475" y="680" width="230" height="75" rx="15" fill="#fbebdf" stroke="#aebbbd" stroke-width="1.5"/>
<text x="590.0" y="725.5" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">指令翻译</text>
<rect x="750" y="680" width="330" height="75" rx="15" fill="#e5f1ed" stroke="#aebbbd" stroke-width="1.5"/>
<text x="915.0" y="725.5" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">Linux 系统调用转换</text>
<path d="M430 717L475 717" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M705 717L750 717" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M54 855H1146" stroke="#aebbbd"/>
<text x="54" y="888" font-size="17" fill="#5a6c75" text-anchor="start" font-weight="400">原创机制示意 · 省略实现细节</text>
<text x="1146" y="888" font-size="17" fill="#5a6c75" text-anchor="end" font-weight="400">13</text>
</svg>