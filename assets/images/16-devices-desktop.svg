<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">从硬件到桌面：驱动不等于整个图形栈</title><desc id="desc">内核提供硬件接口；用户态实现渲染库、窗口组织与媒体服务。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#157d7b"/></marker><marker id="arrowO" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#cd713e"/></marker></defs>
<rect width="1200" height="920" fill="#f7f5ef"/>
<style>text{font-family:"Noto Sans SC","Noto Sans CJK SC",sans-serif}.body{font-size:20px}.small{font-size:17px;fill:#5a6c75}</style>
<text x="54" y="60" font-size="32" fill="#19364a" text-anchor="start" font-weight="700">从硬件到桌面：驱动不等于整个图形栈</text>
<text x="54" y="99" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">内核提供硬件接口；用户态实现渲染库、窗口组织与媒体服务。</text>
<path d="M54 123H1146" stroke="#aebbbd"/>
<rect x="65" y="180" width="280" height="95" rx="15" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="205.0" y="215" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">图形应用</text>
<text x="205.0" y="246" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">绘制请求与窗口内容</text>
<rect x="460" y="180" width="280" height="95" rx="15" fill="#ffffff" stroke="#aebbbd" stroke-width="1.5"/>
<text x="600.0" y="215" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">Mesa / 图形 API 实现</text>
<text x="600.0" y="246" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">渲染与驱动用户态部分</text>
<rect x="855" y="180" width="280" height="95" rx="15" fill="#e5f1ed" stroke="#aebbbd" stroke-width="1.5"/>
<text x="995.0" y="215" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">Wayland compositor</text>
<text x="995.0" y="246" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">组织画面与输入</text>
<text x="995.0" y="273" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">经协议服务应用</text>
<path d="M345 227L460 227" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M205,180L205,150L995,150L995,180" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="600" y="145" font-size="17" fill="#157d7b" text-anchor="middle" font-weight="400">窗口与提交协议（另一条关系）</text>
<rect x="460" y="405" width="280" height="115" rx="15" fill="#e5f1ed" stroke="#aebbbd" stroke-width="1.5"/>
<text x="600.0" y="440" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">内核 DRM / KMS</text>
<text x="600.0" y="471" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">渲染设备接口</text>
<text x="600.0" y="498" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">显示模式与扫描输出</text>
<path d="M600 275L600 405" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M995 275L740 440" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="460" y="650" width="280" height="95" rx="15" fill="#fbebdf" stroke="#aebbbd" stroke-width="1.5"/>
<text x="600.0" y="705.5" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">GPU 与显示设备</text>
<path d="M600 520L600 650" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="65" y="405" width="280" height="115" rx="15" fill="#ffffff" stroke="#aebbbd" stroke-width="1.5"/>
<text x="205.0" y="440" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">设备发现与管理</text>
<text x="205.0" y="471" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">sysfs 提供设备信息</text>
<text x="205.0" y="498" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">udev 执行用户态规则</text>
<rect x="855" y="405" width="280" height="115" rx="15" fill="#ffffff" stroke="#aebbbd" stroke-width="1.5"/>
<text x="995.0" y="440" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">PipeWire 等媒体服务</text>
<text x="995.0" y="471" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">音频 / 视频流组织</text>
<text x="995.0" y="498" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">不替代内核设备驱动</text>
<rect x="855" y="650" width="280" height="95" rx="15" fill="#fbebdf" stroke="#aebbbd" stroke-width="1.5"/>
<text x="995.0" y="705.5" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">内核音频等驱动</text>
<path d="M995 520L995 650" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="64" y="805" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">图示为常见分工；渲染路径不一定经过 compositor 进程；X11 使用不同的协议与组件组织。</text>
<path d="M54 855H1146" stroke="#aebbbd"/>
<text x="54" y="888" font-size="17" fill="#5a6c75" text-anchor="start" font-weight="400">原创机制示意 · 省略实现细节</text>
<text x="1146" y="888" font-size="17" fill="#5a6c75" text-anchor="end" font-weight="400">16</text>
</svg>