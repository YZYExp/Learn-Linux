<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">相似的使用体验，不代表相同的内核</title><desc id="desc">比较接口与设计时，先辨清实现谱系及资料的证据范围。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#157d7b"/></marker><marker id="arrowO" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#cd713e"/></marker></defs>
<rect width="1200" height="900" fill="#f7f5ef"/>
<style>text{font-family:"Noto Sans SC","Noto Sans CJK SC",sans-serif}.body{font-size:20px}.small{font-size:17px;fill:#5a6c75}</style>
<text x="54" y="60" font-size="32" fill="#19364a" text-anchor="start" font-weight="700">相似的使用体验，不代表相同的内核</text>
<text x="54" y="99" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">比较接口与设计时，先辨清实现谱系及资料的证据范围。</text>
<path d="M54 123H1146" stroke="#aebbbd"/>
<rect x="65" y="170" width="500" height="455" rx="20" fill="none" stroke="#aebbbd" stroke-dasharray="6 6"/>
<text x="85" y="203" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">Linux 内核基础</text>
<rect x="105" y="245" width="185" height="100" rx="15" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="197.5" y="280" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">通用发行版</text>
<text x="197.5" y="311" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">GNU 等用户态</text>
<rect x="340" y="245" width="185" height="100" rx="15" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="432.5" y="280" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">Android</text>
<text x="432.5" y="311" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">自有平台栈</text>
<rect x="135" y="465" width="360" height="100" rx="15" fill="#e5f1ed" stroke="#aebbbd" stroke-width="1.5"/>
<text x="315.0" y="523.0" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">Linux 内核</text>
<path d="M197 345L245 465" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M432 345L385 465" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="620" y="170" width="515" height="455" rx="20" fill="none" stroke="#aebbbd" stroke-dasharray="6 6"/>
<text x="640" y="203" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">其他内核体系：不是 Linux 的分支</text>
<rect x="660" y="245" width="200" height="100" rx="15" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="760.0" y="280" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">macOS</text>
<text x="760.0" y="311" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">Darwin 用户态</text>
<rect x="900" y="245" width="195" height="100" rx="15" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="997.5" y="280" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">原厂 Switch</text>
<text x="997.5" y="311" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">Horizon 平台</text>
<rect x="660" y="465" width="200" height="100" rx="15" fill="#fbebdf" stroke="#aebbbd" stroke-width="1.5"/>
<text x="760.0" y="500" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">XNU</text>
<text x="760.0" y="531" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">Mach + BSD 等</text>
<rect x="900" y="465" width="195" height="100" rx="15" fill="#fbebdf" stroke="#aebbbd" stroke-width="1.5"/>
<text x="997.5" y="500" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">Horizon 内核</text>
<text x="997.5" y="531" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">独立设计</text>
<path d="M760 345L760 465" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M997 345L997 465" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="64" y="695" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">macOS：以 Apple 公开源码与文档为依据；Horizon：明确区分社区直接研究与官方资料。</text>
<text x="64" y="723" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">Switch 比较限定原厂 Nintendo Switch 的公开研究范围，不据此推断 Switch 2。</text>
<text x="64" y="751" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">本图表达实现基础，不是完整的 UNIX 历史谱系。</text>
<path d="M54 835H1146" stroke="#aebbbd"/>
<text x="54" y="868" font-size="17" fill="#5a6c75" text-anchor="start" font-weight="400">原创机制示意 · 省略实现细节</text>
<text x="1146" y="868" font-size="17" fill="#5a6c75" text-anchor="end" font-weight="400">19</text>
</svg>