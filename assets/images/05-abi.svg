<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
<title id="title">运行一个二进制：指令与接口要同时对得上</title><desc id="desc">CPU ISA、文件格式、动态链接器、库与系统调用共同组成运行条件。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#157d7b"/></marker><marker id="arrowO" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#cd713e"/></marker></defs>
<rect width="1200" height="880" fill="#f7f5ef"/>
<style>text{font-family:"Noto Sans SC","Noto Sans CJK SC",sans-serif}.body{font-size:20px}.small{font-size:17px;fill:#5a6c75}</style>
<text x="54" y="60" font-size="32" fill="#19364a" text-anchor="start" font-weight="700">运行一个二进制：指令与接口要同时对得上</text>
<text x="54" y="99" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">CPU ISA、文件格式、动态链接器、库与系统调用共同组成运行条件。</text>
<path d="M54 123H1146" stroke="#aebbbd"/>
<rect x="65" y="175" width="250" height="110" rx="15" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="190.0" y="210" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">ELF 可执行文件</text>
<text x="190.0" y="241" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">目标 ISA + ABI</text>
<text x="190.0" y="268" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">段与依赖信息</text>
<rect x="440" y="175" width="315" height="110" rx="15" fill="#ffffff" stroke="#aebbbd" stroke-width="1.5"/>
<text x="597.5" y="210" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">加载与动态链接</text>
<text x="597.5" y="241" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">内核装载 + 动态链接器</text>
<text x="597.5" y="268" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">映射程序及共享库</text>
<rect x="880" y="175" width="250" height="110" rx="15" fill="#e5f1ed" stroke="#aebbbd" stroke-width="1.5"/>
<text x="1005.0" y="210" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">程序自身开始执行</text>
<text x="1005.0" y="241" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">加载器此前已在</text>
<text x="1005.0" y="268" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">当前进程中执行</text>
<path d="M315 230L440 230" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M755 230L880 230" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="440" y="385" width="315" height="100" rx="15" fill="#ffffff" stroke="#aebbbd" stroke-width="1.5"/>
<text x="597.5" y="420" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">libc / 其他库</text>
<text x="597.5" y="451" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">一部分调用进入内核</text>
<path d="M1005 285L755 420" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="440" y="570" width="315" height="95" rx="15" fill="#e5f1ed" stroke="#aebbbd" stroke-width="1.5"/>
<text x="597.5" y="605" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">系统调用 ABI</text>
<text x="597.5" y="636" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">参数、编号、返回约定</text>
<path d="M595 485L595 570" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="880" y="570" width="250" height="95" rx="15" fill="#fbebdf" stroke="#aebbbd" stroke-width="1.5"/>
<text x="1005.0" y="605" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">Linux 内核</text>
<text x="1005.0" y="636" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">实现操作系统语义</text>
<path d="M755 617L880 617" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="65" y="385" width="250" height="190" rx="15" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="190.0" y="420" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">两类兼容问题</text>
<text x="190.0" y="451" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">ISA：指令能否执行</text>
<text x="190.0" y="478" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">ABI：接口是否匹配</text>
<text x="190.0" y="505" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">仅转译指令并不充分</text>
<text x="64" y="735" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">“同为 ARM64”不能自动保证 Linux、macOS、Android 或 Horizon 的二进制互通。</text>
<path d="M54 815H1146" stroke="#aebbbd"/>
<text x="54" y="848" font-size="17" fill="#5a6c75" text-anchor="start" font-weight="400">原创机制示意 · 省略实现细节</text>
<text x="1146" y="848" font-size="17" fill="#5a6c75" text-anchor="end" font-weight="400">05</text>
</svg>