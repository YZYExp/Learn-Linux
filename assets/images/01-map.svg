<text x="54" y="60" font-size="32" fill="#19364a" text-anchor="start" font-weight="700">Linux：从硬件到生态的分层地图</text>
<text x="54" y="99" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">同一套内核机制，通过用户态工具组合成不同的系统。</text>
