<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
<title id="title">隔离机制：视图、预算与权限各管一件事</title><desc id="desc">它们互相配合，不能用一个开关代替完整的隔离边界。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#157d7b"/></marker><marker id="arrowO" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#cd713e"/></marker></defs>
<rect width="1200" height="880" fill="#f7f5ef"/>
<style>text{font-family:"Noto Sans SC","Noto Sans CJK SC",sans-serif}.body{font-size:20px}.small{font-size:17px;fill:#5a6c75}</style>
<text x="54" y="60" font-size="32" fill="#19364a" text-anchor="start" font-weight="700">隔离机制：视图、预算与权限各管一件事</text>
<text x="54" y="99" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">它们互相配合，不能用一个开关代替完整的隔离边界。</text>
<path d="M54 123H1146" stroke="#aebbbd"/>
<rect x="420" y="345" width="360" height="135" rx="15" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="600.0" y="380" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">一个 Linux 进程</text>
<text x="600.0" y="411" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">身份 · 资源引用 · 系统调用</text>
<rect x="65" y="175" width="300" height="115" rx="15" fill="#e5f1ed" stroke="#aebbbd" stroke-width="1.5"/>
<text x="215.0" y="210" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">namespace</text>
<text x="215.0" y="241" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">看见哪一组资源</text>
<text x="215.0" y="268" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">例如 PID / 网络 / 挂载</text>
<rect x="835" y="175" width="300" height="115" rx="15" fill="#e5f1ed" stroke="#aebbbd" stroke-width="1.5"/>
<text x="985.0" y="210" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">cgroup v2</text>
<text x="985.0" y="241" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">使用多少资源</text>
<text x="985.0" y="268" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">层级记账与限制</text>
<rect x="65" y="565" width="300" height="115" rx="15" fill="#fbebdf" stroke="#aebbbd" stroke-width="1.5"/>
<text x="215.0" y="600" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">capabilities</text>
<text x="215.0" y="631" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">拆分部分特权</text>
<text x="215.0" y="658" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">并非所有权限的总开关</text>
<rect x="450" y="565" width="300" height="115" rx="15" fill="#fbebdf" stroke="#aebbbd" stroke-width="1.5"/>
<text x="600.0" y="600" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">seccomp</text>
<text x="600.0" y="631" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">限制系统调用入口</text>
<text x="600.0" y="658" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">按配置检查调用</text>
<rect x="835" y="565" width="300" height="115" rx="15" fill="#fbebdf" stroke="#aebbbd" stroke-width="1.5"/>
<text x="985.0" y="600" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">LSM 策略</text>
<text x="985.0" y="631" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">对象访问等安全决策</text>
<text x="985.0" y="658" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">例如 SELinux / AppArmor</text>
<path d="M365 270L420 375" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M835 270L780 375" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M365 580L450 480" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M600 565L600 480" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M835 580L750 480" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="64" y="750" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">箭头表示约束关系；共享宿主内核意味着这些边界仍依赖同一内核的正确实现。</text>
<path d="M54 815H1146" stroke="#aebbbd"/>
<text x="54" y="848" font-size="17" fill="#5a6c75" text-anchor="start" font-weight="400">原创机制示意 · 省略实现细节</text>
<text x="1146" y="848" font-size="17" fill="#5a6c75" text-anchor="end" font-weight="400">10</text>
</svg>