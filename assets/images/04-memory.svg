<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
<title id="title">虚拟内存：相同地址可以指向不同物理页</title><desc id="desc">页表负责映射；写时复制（COW）延后真正的数据复制。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#157d7b"/></marker><marker id="arrowO" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#cd713e"/></marker></defs>
<rect width="1200" height="880" fill="#f7f5ef"/>
<style>text{font-family:"Noto Sans SC","Noto Sans CJK SC",sans-serif}.body{font-size:20px}.small{font-size:17px;fill:#5a6c75}</style>
<text x="54" y="60" font-size="32" fill="#19364a" text-anchor="start" font-weight="700">虚拟内存：相同地址可以指向不同物理页</text>
<text x="54" y="99" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">页表负责映射；写时复制（COW）延后真正的数据复制。</text>
<path d="M54 123H1146" stroke="#aebbbd"/>
<rect x="65" y="155" width="505" height="455" rx="20" fill="none" stroke="#aebbbd" stroke-dasharray="6 6"/>
<text x="85" y="188" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">写入前：只读映射共享同一物理页</text>
<rect x="100" y="220" width="190" height="90" rx="15" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="195.0" y="255" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">进程 A</text>
<text x="195.0" y="286" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">虚拟页 X</text>
<rect x="100" y="410" width="190" height="90" rx="15" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="195.0" y="445" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">进程 B</text>
<text x="195.0" y="476" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">虚拟页 X</text>
<rect x="360" y="315" width="170" height="110" rx="15" fill="#e5f1ed" stroke="#aebbbd" stroke-width="1.5"/>
<text x="445.0" y="350" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">物理页 P</text>
<text x="445.0" y="381" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">共享内容</text>
<path d="M290 265L360 350" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M290 455L360 390" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="620" y="155" width="515" height="455" rx="20" fill="none" stroke="#aebbbd" stroke-dasharray="6 6"/>
<text x="640" y="188" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">A 写入后：缺页处理建立私有副本</text>
<rect x="655" y="220" width="190" height="90" rx="15" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="750.0" y="255" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">进程 A</text>
<text x="750.0" y="286" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">虚拟页 X</text>
<rect x="655" y="410" width="190" height="90" rx="15" fill="#e9eef5" stroke="#aebbbd" stroke-width="1.5"/>
<text x="750.0" y="445" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">进程 B</text>
<text x="750.0" y="476" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">虚拟页 X</text>
<rect x="920" y="210" width="180" height="110" rx="15" fill="#fbebdf" stroke="#aebbbd" stroke-width="1.5"/>
<text x="1010.0" y="245" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">物理页 P′</text>
<text x="1010.0" y="276" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">A 的新内容</text>
<rect x="920" y="400" width="180" height="110" rx="15" fill="#e5f1ed" stroke="#aebbbd" stroke-width="1.5"/>
<text x="1010.0" y="435" font-size="23" fill="#19364a" text-anchor="middle" font-weight="600">物理页 P</text>
<text x="1010.0" y="466" font-size="18" fill="#5a6c75" text-anchor="middle" font-weight="400">原内容</text>
<path d="M845 265L920 265" fill="none" stroke="#cd713e" stroke-width="2.5" marker-end="url(#arrowO)"/>
<path d="M845 455L920 455" fill="none" stroke="#157d7b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="64" y="675" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">箭头表示页表映射；X 是示意地址，并非所有程序使用同一个固定地址。</text>
<text x="64" y="703" font-size="19" fill="#5a6c75" text-anchor="start" font-weight="400">缺页不一定是错误：按需分配、载入文件页和 COW 都可能触发合法缺页处理。</text>
<path d="M54 815H1146" stroke="#aebbbd"/>
<text x="54" y="848" font-size="17" fill="#5a6c75" text-anchor="start" font-weight="400">原创机制示意 · 省略实现细节</text>
<text x="1146" y="848" font-size="17" fill="#5a6c75" text-anchor="end" font-weight="400">04</text>
</svg>